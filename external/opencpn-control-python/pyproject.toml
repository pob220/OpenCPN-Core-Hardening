[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencpn-control"
version = "0.1.0"
description = "Typed client and CLI for the OpenCPN external-control API"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"

[project.scripts]
opencpnctl = "opencpn_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
