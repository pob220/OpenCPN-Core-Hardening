openapi: 3.1.0
info:
  title: OpenCPN External Control API
  version: 2.0.0-dev
  description: >-
    Disabled-by-default, scoped external-control API. Coordinates are WGS84,
    timestamps are UTC, and units are included in field names.
servers:
  - url: https://127.0.0.1:8443
security:
  - bearerToken: []
paths:
  /api/v2/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: Server and API versions
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, openCpnVersion]
                properties:
                  apiVersion: {type: string}
                  openCpnVersion: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Capabilities available to this principal
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, capabilities]
                properties:
                  apiVersion: {type: string}
                  capabilities:
                    type: array
                    items: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/readiness:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Application readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        default: {$ref: '#/components/responses/Error'}
  /api/v2/navigation:
    get:
      operationId: getNavigation
      x-required-scope: navigation:read
      responses:
        '200':
          description: Immutable navigation snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NavigationSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/events:
    get:
      operationId: subscribeEvents
      description: >-
        Upgrade to WebSocket. The server sends one scoped semantic snapshot,
        then bounded event batches. Send {"subscribe":["navigation", ...]}
        to replace the connection filter. Gaps are reported explicitly.
      x-websocket: true
      responses:
        '101':
          description: WebSocket upgrade accepted
        default: {$ref: '#/components/responses/Error'}
  /api/v2/routes:
    get:
      operationId: listRoutes
      x-required-scope: routes:read
      responses:
        '200':
          description: Route catalogue
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items: {$ref: '#/components/schemas/RouteSummary'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDraftRoute
      x-required-scope: routes:write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RouteMutation'}
      responses:
        '201': {$ref: '#/components/responses/RouteCommand'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/routes/{guid}:
    parameters:
      - name: guid
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getRoute
      x-required-scope: routes:read
      responses:
        '200':
          description: Complete route geometry and revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateDraftRoute
      x-required-scope: routes:write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/RouteMutation'}
                - type: object
                  required: [expectedRevision]
                  properties:
                    expectedRevision: {type: integer, minimum: 0}
      responses:
        '200': {$ref: '#/components/responses/RouteCommand'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteRoute
      x-required-scope: routes:write
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: {type: integer, minimum: 0}
      responses:
        '200': {$ref: '#/components/responses/RouteCommand'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/routes/{guid}/activate:
    parameters:
      - name: guid
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: activateRoute
      x-required-scope: routes:activate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                waypointGuid: {type: string}
      responses:
        '200': {$ref: '#/components/responses/RouteCommand'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/routes/deactivate:
    post:
      operationId: deactivateRoute
      x-required-scope: routes:activate
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/RouteCommand'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/active-route:
    get:
      operationId: getActiveRoute
      x-required-scope: routes:read
      responses:
        '200':
          description: Active route and leg snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActiveRoute'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/chart-safety/validate-point:
    post:
      operationId: validatePoint
      x-required-scope: charts:query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SafetyConstraints'}
                - type: object
                  required: [point]
                  properties:
                    point: {$ref: '#/components/schemas/Coordinate'}
      responses: {$ref: '#/components/x-responses/SafetyResponses'}
  /api/v2/chart-safety/validate-segment:
    post:
      operationId: validateSegment
      x-required-scope: charts:query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SafetyConstraints'}
                - type: object
                  required: [start, end]
                  properties:
                    start: {$ref: '#/components/schemas/Coordinate'}
                    end: {$ref: '#/components/schemas/Coordinate'}
      responses: {$ref: '#/components/x-responses/SafetyResponses'}
  /api/v2/chart-safety/validate-route:
    post:
      operationId: validateRoute
      x-required-scope: charts:query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SafetyConstraints'}
                - type: object
                  required: [route]
                  properties:
                    route:
                      type: array
                      minItems: 2
                      items: {$ref: '#/components/schemas/Coordinate'}
      responses: {$ref: '#/components/x-responses/SafetyResponses'}
  /api/v2/planning/jobs:
    post:
      operationId: startPlanningJob
      x-required-scope: planning:run
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanningRequest'}
      responses:
        '202':
          description: Planning job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningJob'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/planning/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getPlanningJob
      x-required-scope: planning:run
      responses:
        '200':
          description: Current state of an owned planning job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningJob'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: cancelPlanningJob
      x-required-scope: planning:run
      responses:
        '200':
          description: Cancellation requested or terminal job returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningJob'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/planning/jobs/{id}/result:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getPlanningResult
      x-required-scope: planning:run
      responses:
        '200':
          description: Completed planning result; routes are drafts only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningResult'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    Error:
      description: Stable machine-readable error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RouteCommand:
      description: Explicit idempotent route-command result
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RouteCommandResult'}
  x-responses:
    SafetyResponses:
      '200':
        description: Conservative chart-safety decision
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChartSafetyResult'}
      default: {$ref: '#/components/responses/Error'}
  schemas:
    Coordinate:
      type: object
      required: [latitudeDegrees, longitudeDegrees]
      properties:
        latitudeDegrees: {type: number, minimum: -90, maximum: 90}
        longitudeDegrees: {type: number, minimum: -180, maximum: 180}
    Readiness:
      type: object
      required: [ready, closing, unavailableCapabilities]
      properties:
        ready: {type: boolean}
        closing: {type: boolean}
        unavailableCapabilities: {type: array, items: {type: string}}
    NavigationSnapshot:
      type: object
      required: [positionValid, stale, source, receiptTimeUtc, ageMilliseconds]
      properties:
        position: {oneOf: [{$ref: '#/components/schemas/Coordinate'}, {type: 'null'}]}
        positionValid: {type: boolean}
        courseOverGroundDegreesTrue: {type: [number, 'null']}
        speedOverGroundKnots: {type: [number, 'null'], minimum: 0}
        headingDegreesTrue: {type: [number, 'null']}
        magneticVariationDegrees: {type: [number, 'null']}
        source: {type: string}
        measurementTimeUtc: {type: [string, 'null'], format: date-time}
        receiptTimeUtc: {type: string, format: date-time}
        ageMilliseconds: {type: integer, minimum: 0}
        stale: {type: boolean}
    RouteSummary:
      type: object
      required: [guid, name, revision, waypointCount, isLayer, isDraft]
      properties:
        guid: {type: string}
        name: {type: string}
        revision: {type: integer, minimum: 0}
        waypointCount: {type: integer, minimum: 0}
        isLayer: {type: boolean}
        isDraft: {type: boolean}
    Waypoint:
      type: object
      required: [guid, name, position]
      properties:
        guid: {type: string}
        name: {type: string}
        position: {$ref: '#/components/schemas/Coordinate'}
    RouteMutation:
      type: object
      required: [name, waypoints]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        waypoints:
          type: array
          minItems: 2
          maxItems: 10000
          items:
            type: object
            required: [position]
            properties:
              guid: {type: string, maxLength: 128}
              name: {type: string, maxLength: 256}
              position: {$ref: '#/components/schemas/Coordinate'}
    Route:
      allOf:
        - {$ref: '#/components/schemas/RouteSummary'}
        - type: object
          required: [waypoints]
          properties:
            waypoints: {type: array, items: {$ref: '#/components/schemas/Waypoint'}}
    ActiveRoute:
      type: object
      required: [active, routeGuid, activeWaypointGuid, activeLegIndex, routeRevision]
      properties:
        active: {type: boolean}
        routeGuid: {type: [string, 'null']}
        activeWaypointGuid: {type: [string, 'null']}
        activeLegIndex: {type: [integer, 'null'], minimum: 0}
        routeRevision: {type: [integer, 'null'], minimum: 0}
    ApplicationEvent:
      type: object
      required: [type, sequence, timestampUtc, schemaVersion]
      properties:
        type:
          enum: [navigation, navigation-validity, route-catalogue,
                 active-route, chart-database, readiness, planning-job]
        sequence: {type: integer, minimum: 1}
        timestampUtc: {type: string, format: date-time}
        schemaVersion: {type: integer, const: 1}
        subjectId: {type: string}
    RouteCommandResult:
      type: object
      required: [commandId, changed, route, warnings]
      properties:
        commandId: {type: string}
        changed: {type: boolean}
        route: {oneOf: [{$ref: '#/components/schemas/Route'}, {type: 'null'}]}
        warnings: {type: array, items: {type: string}}
    SafetyConstraints:
      type: object
      required: [minimumDepthMeters]
      properties:
        minimumDepthMeters: {type: number, minimum: 0}
        landMarginNauticalMiles: {type: number, minimum: 0, default: 0}
    ChartSafetyResult:
      type: object
      required: [decision, authority, causeCode, chartDatabaseIdentity, constraints, warnings]
      properties:
        decision: {type: string, enum: [pass, fail, unknown]}
        authority: {type: string, enum: [authoritative, fallback, unknown]}
        causeCode: {type: string}
        chartDatabaseIdentity: {type: string}
        constraints: {$ref: '#/components/schemas/SafetyConstraints'}
        warnings: {type: array, items: {type: string}}
        failedSegmentIndex: {type: integer, minimum: 0}
    PlanningRequest:
      type: object
      required: [providerCapability, start, destination, minimumDepthMeters]
      properties:
        providerCapability: {type: string, minLength: 1}
        start: {$ref: '#/components/schemas/Coordinate'}
        destination: {$ref: '#/components/schemas/Coordinate'}
        departureTimeUtc: {type: string, format: date-time}
        minimumDepthMeters: {type: number, minimum: 0}
        landMarginNauticalMiles: {type: number, minimum: 0, default: 0}
        vesselIdentity: {type: string}
        polarIdentity: {type: string}
        weatherDatasetIdentity: {type: string}
        currentDatasetIdentity: {type: string}
        horizonHours: {type: integer, minimum: 1, maximum: 8760, default: 240}
        allowClimatologyFallback: {type: boolean, default: false}
        effortLimit: {type: integer, minimum: 1, maximum: 1000000000,
                      default: 1000000}
        departureWindowBeforeMinutes: {type: integer, minimum: 0,
                                       maximum: 10080, default: 0}
        departureWindowAfterMinutes: {type: integer, minimum: 0,
                                      maximum: 10080, default: 0}
        departureStepMinutes: {type: integer, minimum: 1, maximum: 1440,
                               default: 60}
        concurrentRoutes: {type: integer, minimum: 1, maximum: 16, default: 1}
        routingEffortPercent: {type: integer, minimum: 10, maximum: 400,
                               default: 100}
    PlanningJob:
      type: object
      required: [id, providerCapability, state, progress,
                 cancellationRequested, submittedTimeUtc, updatedTimeUtc]
      properties:
        id: {type: string}
        providerCapability: {type: string}
        state: {enum: [queued, running, completed, failed, cancelled]}
        progress: {type: number, minimum: 0, maximum: 1}
        cancellationRequested: {type: boolean}
        submittedTimeUtc: {type: string, format: date-time}
        updatedTimeUtc: {type: string, format: date-time}
        error: {oneOf: [{$ref: '#/components/schemas/Error'}, {type: 'null'}]}
    PlanningResult:
      type: object
      required: [draftRoute, alternatives, inputProvenance,
                 chartDatabaseIdentity, finalSafety, warnings]
      properties:
        draftRoute: {$ref: '#/components/schemas/RouteMutation'}
        alternatives:
          type: array
          items: {$ref: '#/components/schemas/RouteMutation'}
        inputProvenance: {type: array, items: {type: string}}
        chartDatabaseIdentity: {type: string}
        finalSafety: {$ref: '#/components/schemas/ChartSafetyResult'}
        warnings: {type: array, items: {type: string}}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
