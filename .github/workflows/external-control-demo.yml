---
name: External Control Demo platforms

on:
  push:
    branches:
      - external-control/cross-platform-demo
    paths-ignore:
      - 'manual/**'
  workflow_dispatch:
    inputs:
      core_run_id:
        description: Optional successful workflow run containing the ARM64 core artifact
        required: false
        type: string

jobs:
  debian12-arm64:
    name: Debian 12 ARM64 core
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.core_run_id == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: arm64v8/debian:bookworm
    env:
      OCPN_TARGET: bookworm-arm64
      EXPECTED_ELF_MACHINE: AArch64
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Bootstrap checkout requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Debian build dependencies
        run: ci/external-control-demo/install-debian-build-deps.sh
      - name: Build, test, package and audit
        run: ci/external-control-demo/build-linux.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-arm64"
      - name: Publish retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-external-control-core-debian12-arm64
          path: build-arm64/artifacts/bookworm-arm64
          if-no-files-found: error
          retention-days: 14

  assemble-debian12-arm64:
    name: Assemble and qualify Debian 12 ARM64 bundle
    needs: debian12-arm64
    if: >-
      ${{ always() &&
          (needs.debian12-arm64.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.core_run_id != '')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: arm64v8/debian:bookworm
    steps:
      - name: Bootstrap checkout requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install qualification requirements
        run: |
          ci/external-control-demo/install-debian-build-deps.sh
          apt-get update
          apt-get install -y --no-install-recommends \
            curl iproute2 libaec0 libblosc1 libeccodes0 libhdf5-103-1 \
            libhdf5-hl-100 libnetcdf19 libproj25 libqhull-r8.0 libsz2 \
            libzip4 python3-build python3-pip python3-setuptools python3-tk \
            python3-venv util-linux xauth
          python3 -m pip install --break-system-packages \
            'packaging==25.0' 'setuptools==80.9.0' 'wheel==0.45.1'
      - uses: actions/download-artifact@v4
        with:
          name: opencpn-external-control-core-debian12-arm64
          path: inputs/core
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.core_run_id || github.run_id }}
      - name: Fetch exact qualified plug-in packages
        run: |
          mkdir -p inputs/plugins
          curl --fail --location \
            'https://output.circle-artifacts.com/output/job/f4676173-d84d-478b-a490-a8d79d477990/artifacts/0/artifacts/bookworm-arm64/package/xgrib_pi-0.2.4.0-debian-arm64-12-bookworm-arm64.tar.gz' \
            --output inputs/plugins/xgrib.tar.gz
          curl --fail --location \
            'https://output.circle-artifacts.com/output/job/0263610a-cef4-4d07-8ffe-7a1bb256f848/artifacts/0/artifacts/bookworm-arm64/package/xweather_routing_pi-0.1.0.0-debian-arm64-12-bookworm-arm64.tar.gz' \
            --output inputs/plugins/xweather.tar.gz
          curl --fail --location \
            'https://dl.cloudsmith.io/public/opencpn/polar-prod/raw/names/polar_pi-1.2.38.0-debian-arm64-12-bookworm-arm64-tarball/versions/v1.2.38.0/polar_pi-1.2.38.0-debian-arm64-12-bookworm-arm64.tar.gz' \
            --output inputs/plugins/polar.tar.gz
          echo 'dabb9bd92fe6f8269eedcc8b2dadabcfa2738537e6218d166fa0ae0ae6262db7  inputs/plugins/xgrib.tar.gz' | sha256sum --check
          echo 'd1aa47b950f7b807691c1f9057972735be75bf56ff2d987f38f9bab239da2127  inputs/plugins/xweather.tar.gz' | sha256sum --check
          echo '85e000060e7f10df4a01424257e685ac6a8b8bd1cd145030a1a4c8bdb50ce470  inputs/plugins/polar.tar.gz' | sha256sum --check
      - name: Build and test exact upgraded Climatology source
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          OCPN_TARGET: bookworm-arm64
        run: |
          git clone --filter=blob:none https://github.com/pob220/climatology_pi.git inputs/climatology_pi
          git -C inputs/climatology_pi checkout cd00282e6ea2784a6d78ccfe47fed713269ad87e
          ci/external-control-demo/package-climatology-linux.sh \
            inputs/climatology_pi \
            inputs/climatology-build \
            inputs/plugins/climatology.tar.gz \
            AArch64
      - name: Build and test exact upgraded Celestial Navigation source
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          GIT_LFS_SKIP_SMUDGE: '1'
          OCPN_TARGET: bookworm-arm64
        run: |
          git clone --filter=blob:none --recurse-submodules \
            https://github.com/pob220/celestial_navigation_pi.git \
            inputs/celestial_navigation_pi
          git -C inputs/celestial_navigation_pi checkout de135443938eb01f2139d16e1e26f144b00d8bdf
          git -C inputs/celestial_navigation_pi submodule update --init --recursive
          ci/external-control-demo/package-celestial-linux.sh \
            inputs/celestial_navigation_pi \
            inputs/celestial-build \
            inputs/plugins/celestial-navigation.tar.gz \
            AArch64
      - name: Check out exact Scheduler source
        run: |
          git clone https://github.com/pob220/opencpn-scheduler.git inputs/opencpn-scheduler
          git -C inputs/opencpn-scheduler checkout 539e1e80a00aa2ca0df0853fc9ebd0f4c8bffa9e
      - name: Assemble isolated bundle
        run: |
          core_installer=$(find inputs/core/package -maxdepth 1 -type f -name '*.sh' -print -quit)
          test -n "$core_installer"
          core_revision=$(cat inputs/core/source-commit.txt)
          EXTERNAL_CONTROL_DEMO_DATE=2026-08-25 \
            EXTERNAL_CONTROL_CORE_REVISION="$core_revision" \
            tools/external-control-demo/assemble-linux.sh \
              "$core_installer" \
              inputs/plugins/xgrib.tar.gz \
              inputs/plugins/xweather.tar.gz \
              inputs/plugins/climatology.tar.gz \
              inputs/plugins/polar.tar.gz \
              inputs/plugins/celestial-navigation.tar.gz \
              inputs/opencpn-scheduler \
              candidate debian12-arm64 aarch64
      - name: Clean-install and API smoke qualification
        env:
          RUN_GUI_SMOKE: '1'
        run: |
          qualification_log=candidate/qualification.log
          if ! tools/external-control-demo/qualify-linux-bundle.sh \
              candidate/OpenCPN-External-Control-Demo-2026-08-25-debian12-arm64 \
              AArch64 >"$qualification_log" 2>&1; then
            cat "$qualification_log"
            exit 1
          fi
          cat "$qualification_log"
      - name: Publish qualified candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-external-control-demo-debian12-arm64
          path: |
            candidate/OpenCPN-External-Control-Demo-2026-08-25-debian12-arm64.tar.gz
            candidate/OpenCPN-External-Control-Demo-2026-08-25-debian12-arm64.tar.gz.sha256
            candidate/qualification.log
          if-no-files-found: warn
          retention-days: 14
