---
name: External Control Demo platforms

on:
  push:
    branches:
      - external-control/cross-platform-demo
      - external-control/chart-safety-preview-20260830
      - external-control/chart-safety-preview-20260831
    paths-ignore:
      - 'manual/**'
  workflow_dispatch:
    inputs:
      core_run_id:
        description: Optional workflow run with a successful ARM64 core job and its artifact
        required: false
        type: string
      x86_core_run_id:
        description: Optional workflow run with a successful x86_64 core job and its artifact
        required: false
        type: string
      trixie_core_run_id:
        description: Optional workflow run with a successful Debian 13 x86_64 core artifact
        required: false
        type: string
      candidate_run_id:
        description: Optional existing candidate run to requalify without rebuilding plugins (also supply matching core run IDs)
        required: false
        type: string
      candidate_source:
        description: Required assembly commit SHA when requalifying an existing candidate
        required: false
        type: string

jobs:
  debian12-arm64:
    name: Debian 12 ARM64 core
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.core_run_id == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: arm64v8/debian:bookworm
    env:
      OCPN_TARGET: bookworm-arm64
      EXPECTED_ELF_MACHINE: AArch64
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Bootstrap checkout requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Debian build dependencies
        run: ci/external-control-demo/install-debian-build-deps.sh
      - name: Build, test, package and audit
        run: ci/external-control-demo/build-linux.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-arm64"
      - name: Publish retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-external-control-core-debian12-arm64
          path: build-arm64/artifacts/bookworm-arm64
          if-no-files-found: error
          retention-days: 14

  debian12-x86_64:
    name: Debian 12 x86_64 core
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.x86_core_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:bookworm
    env:
      OCPN_TARGET: bookworm
      EXPECTED_ELF_MACHINE: Advanced Micro Devices X86-64
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Bootstrap checkout requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Debian build dependencies
        run: ci/external-control-demo/install-debian-build-deps.sh
      - name: Build, test, package and audit
        run: ci/external-control-demo/build-linux.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-x86_64"
      - name: Publish retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-external-control-core-debian12-x86_64
          path: build-x86_64/artifacts/bookworm
          if-no-files-found: error
          retention-days: 14

  debian13-x86_64:
    name: Debian 13 x86_64 core
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.trixie_core_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:trixie
    env:
      OCPN_TARGET: trixie
      EXPECTED_ELF_MACHINE: Advanced Micro Devices X86-64
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Bootstrap checkout requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Debian build dependencies
        run: ci/external-control-demo/install-debian-build-deps.sh
      - name: Build, test, package and audit
        run: ci/external-control-demo/build-linux.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-trixie"
      - name: Publish retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-external-control-core-debian13-x86_64
          path: build-trixie/artifacts/trixie
          if-no-files-found: error
          retention-days: 14

  assemble-debian12-x86_64:
    name: Assemble and qualify Debian 12 x86_64 bundle
    needs: debian12-x86_64
    if: >-
      ${{ always() &&
          (needs.debian12-x86_64.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.x86_core_run_id != '')) }}
    uses: ./.github/workflows/assemble-external-control-demo.yml
    with:
      platform: debian12-x86_64
      target: bookworm
      image: debian:bookworm
      runner: ubuntu-24.04
      expected_uname: x86_64
      expected_machine: Advanced Micro Devices X86-64
      parallel_jobs: '3'
      release_date: '2026-11-25'
      core_run_id: ${{ inputs.x86_core_run_id || format('{0}', github.run_id) }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_source: ${{ inputs.candidate_source }}

  assemble-debian12-arm64:
    name: Assemble and qualify Debian 12 ARM64 bundle
    needs: debian12-arm64
    if: >-
      ${{ always() &&
          (needs.debian12-arm64.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.core_run_id != '')) }}
    uses: ./.github/workflows/assemble-external-control-demo.yml
    with:
      platform: debian12-arm64
      target: bookworm-arm64
      image: arm64v8/debian:bookworm
      runner: ubuntu-24.04-arm
      expected_uname: aarch64
      expected_machine: AArch64
      parallel_jobs: '2'
      release_date: '2026-11-25'
      core_run_id: ${{ inputs.core_run_id || format('{0}', github.run_id) }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_source: ${{ inputs.candidate_source }}

  assemble-debian13-x86_64:
    name: Assemble and qualify Debian 13 x86_64 bundle
    needs: debian13-x86_64
    if: >-
      ${{ always() &&
          (needs.debian13-x86_64.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.trixie_core_run_id != '')) }}
    uses: ./.github/workflows/assemble-external-control-demo.yml
    with:
      platform: debian13-x86_64
      target: trixie
      image: debian:trixie
      runner: ubuntu-24.04
      expected_uname: x86_64
      expected_machine: Advanced Micro Devices X86-64
      parallel_jobs: '3'
      release_date: '2026-11-25'
      core_run_id: ${{ inputs.trixie_core_run_id || format('{0}', github.run_id) }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_source: ${{ inputs.candidate_source }}
