name: Preview platform expansion qualification
'on':
  push:
    branches:
    - preview/platform-expansion-20260911
  workflow_dispatch:
    inputs:
      platform_group:
        description: Qualification group (avoid repeating unaffected builds)
        type: choice
        default: all
        options:
        - all
        - linux
        - native
        - macos
        - portability
permissions:
  contents: read
concurrency:
  group: preview-platform-${{ github.ref }}-${{ inputs.platform_group || 'all' }}
  cancel-in-progress: false
jobs:
  linux-bundle:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform_group == 'all' || inputs.platform_group == 'linux' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    container:
      image: ${{ matrix.image }}
      volumes:
      - /etc/ssl/certs/ca-certificates.crt:/tmp/preview-runner-ca.crt:ro
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: debian13-x86_64
          image: debian:trixie
          runner: ubuntu-24.04
          target: trixie
          arch: x86_64
          machine: Advanced Micro Devices X86-64
          parallel: 3
        - platform: debian13-arm64
          image: arm64v8/debian:trixie
          runner: ubuntu-24.04-arm
          target: trixie-arm64
          arch: aarch64
          machine: AArch64
          parallel: 2
        - platform: ubuntu24.04-x86_64
          image: ubuntu:24.04
          runner: ubuntu-24.04
          target: noble
          arch: x86_64
          machine: Advanced Micro Devices X86-64
          parallel: 3
        - platform: ubuntu22.04-x86_64
          image: ubuntu:22.04
          runner: ubuntu-24.04
          target: jammy
          arch: x86_64
          machine: Advanced Micro Devices X86-64
          parallel: 3
    env:
      OCPN_TARGET: ${{ matrix.target }}
      EXPECTED_ELF_MACHINE: ${{ matrix.machine }}
      PREVIEW_PLATFORM: ${{ matrix.platform }}
      PREVIEW_ARCH: ${{ matrix.arch }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
    steps:
    - name: Bootstrap with bounded network requests
      shell: bash
      run: |-
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        mkdir -p /etc/ssl/certs
        cp /tmp/preview-runner-ca.crt /etc/ssl/certs/ca-certificates.crt
        find /etc/apt/sources.list.d -type f \( -name '*.sources' -o -name '*.list' \) -exec sed -i 's|http://|https://|g' {} +
        if [[ -f /etc/apt/sources.list ]]; then sed -i 's|http://|https://|g' /etc/apt/sources.list; fi
        apt-get -o Acquire::https::CaInfo=/etc/ssl/certs/ca-certificates.crt -o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        apt-get -o Acquire::https::CaInfo=/etc/ssl/certs/ca-certificates.crt -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ca-certificates git
        printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'APT::Update::Error-Mode "any";' > /etc/apt/apt.conf.d/80-preview-network
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Install target distribution dependencies
      run: bash ci/external-control-demo/platform-dependencies.sh
    - name: Build and test hardened core
      run: bash ci/external-control-demo/build-linux.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/core-build"
    - name: Stage this job core only
      run: |-
        mkdir -p inputs/core
        cp -a "core-build/artifacts/$OCPN_TARGET/." inputs/core/
    - name: Fetch pinned x86_64 Polar and official o-charts helper
      run: |
        mkdir -p inputs/plugins
        curl --fail --location \
          'https://dl.cloudsmith.io/public/opencpn/polar-prod/raw/names/polar_pi-1.2.38.0-debian-x86_64-12-bookworm-tarball/versions/v1.2.38.0/polar_pi-1.2.38.0-debian-x86_64-12-bookworm.tar.gz' \
          --output inputs/plugins/polar.tar.gz
        curl --fail --location \
          'https://dl.cloudsmith.io/public/opencpn/o-charts-prod/raw/names/o-charts-v2.2.1-debian-x86_64-12-tarball/versions/v2.2.1/o-charts-v2.2.1_debian-x86_64-12-x86_64.tar.gz' \
          --output inputs/plugins/ocharts-official.tar.gz
        echo '6130386533e5661cc6f940a30ab0633af5c30ec5efac2697d72e08634cbb08fc  inputs/plugins/polar.tar.gz' | sha256sum --check
        echo '432eccc267d9ca70d2fcd067db5e792d88fd5c437013d11da8d96ef131252dd0  inputs/plugins/ocharts-official.tar.gz' | sha256sum --check
      if: ${{ matrix.arch == 'x86_64' }}
    - name: Fetch pinned aarch64 Polar and official o-charts helper
      run: |
        mkdir -p inputs/plugins
        curl --fail --location \
          'https://dl.cloudsmith.io/public/opencpn/polar-prod/raw/names/polar_pi-1.2.38.0-debian-arm64-12-bookworm-arm64-tarball/versions/v1.2.38.0/polar_pi-1.2.38.0-debian-arm64-12-bookworm-arm64.tar.gz' \
          --output inputs/plugins/polar.tar.gz
        curl --fail --location \
          'https://dl.cloudsmith.io/public/opencpn/o-charts-prod/raw/names/o-charts-v2.2.1-debian-arm64-A64-12-tarball/versions/v2.2.1/o-charts-v2.2.1_debian-arm64-12-arm64.tar.gz' \
          --output inputs/plugins/ocharts-official.tar.gz
        echo '85e000060e7f10df4a01424257e685ac6a8b8bd1cd145030a1a4c8bdb50ce470  inputs/plugins/polar.tar.gz' | sha256sum --check
        echo '861ad2ec41b00afbbabcae1d7bd989d2afec3c9e428227cecb28b9b87fffe104  inputs/plugins/ocharts-official.tar.gz' | sha256sum --check
      if: ${{ matrix.arch == 'aarch64' }}
    - name: Build and test exact fixed xGRIB source
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      run: |
        git clone --filter=blob:none --recurse-submodules \
          https://github.com/pob220/xgrib_pi.git inputs/xgrib_pi
        git -C inputs/xgrib_pi checkout b4fd23d75df24e6c8bb6c3ac2ac502dd8e15b637
        git -C inputs/xgrib_pi apply --check "$GITHUB_WORKSPACE/ci/external-control-demo/xgrib-0.2.5.1-provider.patch"
        git -C inputs/xgrib_pi apply "$GITHUB_WORKSPACE/ci/external-control-demo/xgrib-0.2.5.1-provider.patch"
        git -C inputs/xgrib_pi submodule update --init --recursive
        test "$(git -C inputs/xgrib_pi/generator rev-parse HEAD)" = \
          6156c997191ffbfa9fba39385e84fa06a2fed353
        inputs/xgrib_pi/ci/build-linux-catalogue.sh \
          inputs/xgrib_pi inputs/xgrib-build inputs/xgrib-stage \
          inputs/xgrib-build/artifacts/$OCPN_TARGET
        xgrib_archive=$(find inputs/xgrib-build/artifacts/$OCPN_TARGET/package \
          -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        test -n "$xgrib_archive"
        cp "$xgrib_archive" inputs/plugins/xgrib.tar.gz
    - name: Build and test exact chart-aware xWeatherRouting source
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
        CIRCLE_PROJECT_REPONAME: xweather_routing_pi
      run: |
        git clone --filter=blob:none --recurse-submodules \
          https://github.com/pob220/weather_routing_pi.git inputs/xweather_routing_pi
        git -C inputs/xweather_routing_pi checkout 49036e934a4102d8426819f92f3cc5f61ead717f
        git -C inputs/xweather_routing_pi submodule update --init --recursive
        inputs/xweather_routing_pi/ci/build-linux-catalogue.sh \
          inputs/xweather_routing_pi inputs/xweather-build
        xweather_archive=$(find inputs/xweather-build/artifacts/$OCPN_TARGET/package \
          -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
        test -n "$xweather_archive"
        cp "$xweather_archive" inputs/plugins/xweather.tar.gz
    - name: Build exact o-charts chart-safety provider
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      run: |
        git clone --filter=blob:none --recurse-submodules \
          https://github.com/pob220/o-charts_pi.git inputs/o-charts_pi
        git -C inputs/o-charts_pi checkout b369c4cae0e84ea43847f64a26cb107ae1ffebe5
        git -C inputs/o-charts_pi submodule update --init --recursive
        ci/external-control-demo/package-ocharts-source-preview-linux.sh \
          inputs/o-charts_pi inputs/ocharts-build \
          inputs/plugins/ocharts-official.tar.gz \
          inputs/plugins/ocharts-preview.tar.gz \
          "$EXPECTED_ELF_MACHINE"
    - name: Build and test exact upgraded Climatology source
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      run: |
        git clone --filter=blob:none https://github.com/pob220/climatology_pi.git inputs/climatology_pi
        git -C inputs/climatology_pi checkout cd00282e6ea2784a6d78ccfe47fed713269ad87e
        ci/external-control-demo/package-climatology-linux.sh \
          inputs/climatology_pi \
          inputs/climatology-build \
          inputs/plugins/climatology.tar.gz \
          "$EXPECTED_ELF_MACHINE"
    - name: Build and test exact upgraded Celestial Navigation source
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
        GIT_LFS_SKIP_SMUDGE: '1'
      run: |
        git clone --filter=blob:none --recurse-submodules \
          https://github.com/pob220/celestial_navigation_pi.git \
          inputs/celestial_navigation_pi
        git -C inputs/celestial_navigation_pi checkout --detach 49ecbe0c8b68e486595c86966054a741a97f6475
        test "$(git -C inputs/celestial_navigation_pi rev-parse HEAD)" = \
          49ecbe0c8b68e486595c86966054a741a97f6475
        git -C inputs/celestial_navigation_pi submodule update --init --recursive
        curl --fail --location \
          https://github.com/pob220/celestial_navigation_pi/releases/download/eclipse-data-2026.1/de440s.bsp \
          --output inputs/celestial_navigation_pi/eclipse/data/de440s.bsp
        echo 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  inputs/celestial_navigation_pi/eclipse/data/de440s.bsp' \
          | sha256sum --check
        test "$(stat -c %s inputs/celestial_navigation_pi/eclipse/data/de440s.bsp)" = 32726016
        ci/external-control-demo/package-celestial-linux.sh \
          inputs/celestial_navigation_pi \
          inputs/celestial-build \
          inputs/plugins/celestial-navigation.tar.gz \
          "$EXPECTED_ELF_MACHINE"
    - name: Check out exact Scheduler source
      run: |
        git clone https://github.com/pob220/opencpn-scheduler.git inputs/opencpn-scheduler
        git -C inputs/opencpn-scheduler checkout 539e1e80a00aa2ca0df0853fc9ebd0f4c8bffa9e
    - name: Assemble isolated bundle
      run: |
        core_installer=$(find inputs/core/package -maxdepth 1 -type f -name '*.sh' -print -quit)
        test -n "$core_installer"
        core_revision=$(cat inputs/core/source-commit.txt)
        EXTERNAL_CONTROL_DEMO_DATE=2026-09-11 \
          EXTERNAL_CONTROL_CORE_REVISION="$core_revision" \
          tools/external-control-demo/assemble-linux.sh \
            "$core_installer" \
            inputs/plugins/xgrib.tar.gz \
            inputs/plugins/xweather.tar.gz \
            inputs/plugins/ocharts-preview.tar.gz \
            inputs/plugins/climatology.tar.gz \
            inputs/plugins/polar.tar.gz \
            inputs/plugins/celestial-navigation.tar.gz \
            inputs/opencpn-scheduler \
            candidate "$PREVIEW_PLATFORM" "$PREVIEW_ARCH"
    - name: Clean-install and API/MCP smoke qualification
      env:
        RUN_GUI_SMOKE: '1'
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      run: |
        qualification_log=candidate/qualification.log
        if ! tools/external-control-demo/qualify-linux-bundle.sh \
            "candidate/OpenCPN-External-Control-Demo-2026-09-11-$PREVIEW_PLATFORM" \
            "$EXPECTED_ELF_MACHINE" >"$qualification_log" 2>&1; then
          cat "$qualification_log"
          exit 1
        fi
        cat "$qualification_log"
    - name: Retain successful candidate (not a public release)
      uses: actions/upload-artifact@v4
      with:
        name: qualified-candidate-${{ matrix.platform }}
        path: |-
          candidate/*.tar.gz
          candidate/*.sha256
          candidate/qualification.log
        if-no-files-found: error
        retention-days: 14
    - name: Retain diagnostic evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidence-${{ matrix.platform }}
        path: |-
          core-build/artifacts/**/logs
          core-build/artifacts/**/tests
          inputs/**/artifacts/**/logs
          inputs/**/artifacts/**/tests
          candidate/qualification.log
        if-no-files-found: warn
        retention-days: 14
  windows-core:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform_group == 'all' || inputs.platform_group == 'native' }}
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    - name: Core build and test probe - no installer publication
      shell: cmd
      run: ci\external-control-demo\qualify-windows-core.cmd
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-x86-core-evidence-NOT-A-BUNDLE
        path: |-
          evidence
          build-platform/CMakeCache.txt
          build-platform/CMakeFiles/CMakeConfigureLog.yaml
        if-no-files-found: warn
  macos-core:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform_group == 'all' || inputs.platform_group == 'native' || inputs.platform_group == 'macos' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-14
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    env:
      PREVIEW_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: ABI-compatible core build probe - no installer publication
      run: bash ci/external-control-demo/qualify-macos-core.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: macos-${{ matrix.arch }}-core-evidence-NOT-A-BUNDLE
        path: |-
          evidence
          build-platform/CMakeCache.txt
          build-platform/CMakeFiles/CMakeConfigureLog.yaml
        if-no-files-found: warn
  arch-core:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform_group == 'all' || inputs.platform_group == 'portability' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: archlinux:base-devel
    steps:
    - name: Bootstrap Arch checkout tools
      run: pacman -Syu --noconfirm --needed git ca-certificates
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Rolling Arch core qualification - no installer publication
      run: bash ci/external-control-demo/qualify-arch-core.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: archlinux-x86_64-core-evidence-NOT-A-BUNDLE
        path: |-
          evidence
          build-platform/CMakeCache.txt
          build-platform/CMakeFiles/CMakeConfigureLog.yaml
        if-no-files-found: warn
  flatpak-core:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform_group == 'all' || inputs.platform_group == 'portability' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          arch: x86_64
        - runner: ubuntu-24.04-arm
          arch: aarch64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Prepare pinned upstream SDK manifest with isolated preview identity
      shell: bash
      run: |-
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder python3-yaml
        mkdir -p inputs evidence
        git clone https://github.com/flathub/org.opencpn.OpenCPN.git inputs/flatpak-manifest
        git -C inputs/flatpak-manifest checkout --detach e2b8d9f9518a36ea961fa520bc6969416dbb6020
        python3 ci/external-control-demo/prepare-flatpak-probe.py \
          inputs/flatpak-manifest/org.opencpn.OpenCPN.yaml "$GITHUB_SHA"
        cp inputs/flatpak-manifest/io.github.pob220.OpenCPNCorePreview.json evidence/
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - name: Compile and test in the matching architecture SDK - no publication
      shell: bash
      run: |-
        set -euo pipefail
        flatpak-builder --user --install-deps-from=flathub --disable-cache \
          --keep-build-dirs --arch=${{ matrix.arch }} --jobs=3 \
          build-flatpak inputs/flatpak-manifest/io.github.pob220.OpenCPNCorePreview.json \
          2>&1 | tee evidence/flatpak-build.log
        flatpak list --user --runtime --columns=ref,commit > evidence/sdk-commits.txt
        git rev-parse HEAD > evidence/source-commit.txt
        file build-flatpak/files/bin/opencpn > evidence/architecture.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: flatpak-${{ matrix.arch }}-core-evidence-NOT-A-BUNDLE
        path: evidence
        if-no-files-found: warn
